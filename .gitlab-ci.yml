# Use a basic image
image: alpine:latest

# Optional: define stages
stages:
  - deploy

pages:
  stage: deploy
  script:
    - mkdir -p public
    # If your static files are already in public, you might not need any script
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'
