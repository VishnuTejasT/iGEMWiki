image: python:3.6

pages:
  stage: build
  script:
    - pip install --no-cache-dir -r dependencies.txt
    # This line patches the broken Frozen-Flask import so it works on Python 3.13:
    - export FLASK_APP=app:main_app
    - flask freeze
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always