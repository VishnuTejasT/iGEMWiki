image: alpine:latest

pages:
  stage: build
  script:
    - mkdir -p public/static
    - cp -a wiki/. public/
    - cp -a static/. public/static/
    - test -f public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
